<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Person IN/OUT</title>

<style>
body { font-family: Arial; background: #f4f6f8; }
table { width: 95%; margin: auto; border-collapse: collapse; background: white; }
th, td { padding: 12px; border: 1px solid #ccc; text-align: center; }
th { background: #2c3e50; color: white; }
img { width: 160px; border-radius: 6px; }
h2 { text-align: center; }

.thumb {
    cursor: pointer;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.85);
}



/* IMAGE AREA */
.modal-content {
    position: relative;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
}

.modal-content img {
    max-width: 90%;
    max-height: 90%;
    transform: scale(1);
    transition: transform 0.2s ease;
}
/* CONTROLS */
.controls {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    z-index: 3;
}

/* CLOSE BUTTON */
.close-btn {
    position: absolute;
    top: 15px;
    right: 25px;
    font-size: 36px;
    color: white;
    cursor: pointer;
    z-index: 3;
}

/* OVERLAY */
.overlay {
    position: absolute;
    inset: 0;
    background: transparent;
    z-index: 1;  
}

.controls button {
    padding: 10px 16px;
    font-size: 18px;
    margin: 0 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Person IN/OUT History</h2>

<table>
<tr>
    <th>ID</th>
    <th>Timestamp</th>
    <th>IN</th>
    <th>OUT</th>
</tr>

{% for row in records %}
<tr>
    <td>{{ row.id }}</td>
    <td>{{ row.times }}</td>

    <td>
    {% if row.in_path %}
        <img class="thumb"
             src="{{ url_for('serve_images', filename=row.in_path.replace('\\', '/')) }}"
             onclick="openModal(this.src)" alt="In Image">
    {% else %}-{% endif %}
    </td>

    <td>
    {% if row.out_path %}
        <img class="thumb"
             src="{{ url_for('serve_images', filename=row.out_path.replace('\\', '/')) }}"
             onclick="openModal(this.src)" alt="Out image">
    {% else %}-{% endif %}
    </td>
</tr>
{% endfor %}
</table>

<!-- MODAL STRUCTURE -->
<div id="imageModal" class="modal">

    <!-- THIS MUST BE FIRST -->
    <div class="overlay" onclick="closeModal()"></div>

    <span class="close-btn" onclick="closeModal()">×</span>

    <div class="modal-content">
        <img id="modalImage">
    </div>

    <div class="controls">
        <button onclick="zoomIn()">+</button>
        <button onclick="zoomOut()">−</button>
        <button onclick="resetZoom()">Reset</button>
    </div>
</div>


<script>
let scale = 1;
const modal = document.getElementById("imageModal");
const modalImg = document.getElementById("modalImage");

function openModal(src) {
    modal.style.display = "block";
    modalImg.src = src;
    scale = 1;
    applyZoom();
}

function closeModal() {
    modal.style.display = "none";
}

function zoomIn() {
    scale += 0.2;
    applyZoom();
}

function zoomOut() {
    scale = Math.max(0.2, scale - 0.2);
    applyZoom();
}

function resetZoom() {
    scale = 1;
    applyZoom();
}

function applyZoom() {
    modalImg.style.transform = `scale(${scale})`;
}

/* ESC key close */
document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
});

/* Mouse wheel zoom */
modalImg.addEventListener("wheel", e => {
    e.preventDefault();
    scale += e.deltaY < 0 ? 0.1 : -0.1;
    scale = Math.max(0.2, scale);
    applyZoom();
});
</script>

</body>
</html>
